[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wm-model5"
version = "0.1.0"
description = "WM: 5D-решётчатая модель (время, энергия, вероятность, гравитация, поля)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
wm = "wm.cli:main"

[tool.setuptools]
packages = ["wm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
